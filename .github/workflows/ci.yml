# DEP-07: pipeline versionado do backend (pytest de integração + pip-audit).
# O runner é externo (GitHub Actions). Notas para quem operar o CI:
#  - JWT_SECRET_KEY e demais segredos vão em GitHub Secrets, nunca no repo.
#  - A suíte é de INTEGRAÇÃO (PG18 + RLS real, ver docs/ADR-002). Aqui o banco de teste
#    é montado aplicando as migrations em ordem sobre um Postgres de service; o fluxo
#    LOCAL (tools/setup_test_db.py) clona o schema do dev via docker e difere deste.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: dbadmin
          POSTGRES_DB: contrato_visto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: contrato_visto_test
      TEST_DB_NAME: contrato_visto_test
      DEV_DB_NAME: contrato_visto
      DB_USER: dbadmin
      DB_PASS: dbadmin
      DB_ADMIN_USER: dbadmin
      DB_ADMIN_PASS: dbadmin
      ENVIRONMENT: test
      PAYMENT_GATE: soft
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'ci-only-secret-nao-usar-em-producao-1234' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # cv_app (role não-owner usada pelos testes de RLS) — as migrations aplicam FORCE RLS.
      - run: PGPASSWORD=dbadmin psql -h localhost -U dbadmin -d contrato_visto_test -v ON_ERROR_STOP=1 -c "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='cv_app') THEN CREATE ROLE cv_app LOGIN PASSWORD 'cv_app'; END IF; END $$;"
      - run: for f in migrations/*.sql; do echo "-> $f"; PGPASSWORD=dbadmin psql -h localhost -U dbadmin -d contrato_visto_test -v ON_ERROR_STOP=1 -f "$f"; done
      - run: python -m pytest -q -p no:randomly
      - run: python -m tools.pip_audit --local --progress-spinner off
      - run: python -m pip check
